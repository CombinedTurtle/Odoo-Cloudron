[supervisord]
nodaemon=true
user=root
logfile=/app/data/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgresql]
command=/app/pkg/start-postgres.sh
user=root
autostart=true
autorestart=true
stdout_logfile=/app/data/postgresql.log
stderr_logfile=/app/data/postgresql_error.log

[program:nginx]
# Wait for start-odoo.sh to generate /run/odoo-nginx.conf before starting nginx.
# Without this, nginx races ahead of config generation and crashes (FATAL),
# leaving the app unreachable until nginx is manually started.
command=/bin/bash -c 'while [ ! -f /run/odoo-nginx.conf ]; do sleep 1; done; exec /usr/sbin/nginx -c /run/odoo-nginx.conf -g "daemon off;"'
user=root
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:odoo]
command=/app/pkg/start-odoo.sh
user=root
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
